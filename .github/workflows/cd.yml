name: CD Pipeline - Continuous Deployment to Oracle Cloud

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Pipeline - Project Final Level A"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Oracle Cloud VM via SSH
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'marcondesjr89' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Deploy on Remote Host via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo ">>> [1/3] Atualizando repositorio no servidor..."
            cd ~/gerenciador-vendas-agua
            git fetch origin main
            git reset --hard origin/main

            echo ">>> [2/3] Verificando integridade das variaveis de ambiente..."
            if [ ! -f .env ]; then
              echo "ERRO CRITICO: Arquivo .env de producao nao encontrado na VM!"
              exit 1
            fi

            echo ">>> [3/3] Reconstruindo e reiniciando containers em producao..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo ">>> Verificando status dos containers:"
            docker compose -f docker-compose.prod.yml ps
