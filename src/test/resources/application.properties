# ===================================================================
# Configuracoes de Testes Automatizados (Banco H2 em Memoria)
# ===================================================================
spring.application.name=gerenciador-vendas-agua-test

# Banco de Dados H2 em Memoria (Compatibilidade PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate para Testes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway desabilitado para testes unitarios/integrados com H2
spring.flyway.enabled=false

# Cache em memoria simples nos testes (sem conexao obrigatoria ao Redis)
spring.cache.type=simple
spring.data.redis.repositories.enabled=false

# Desativar banners durante testes
spring.main.banner-mode=off

# Actuator & Observabilidade RED nos testes
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99
management.tracing.sampling.probability=1.0
