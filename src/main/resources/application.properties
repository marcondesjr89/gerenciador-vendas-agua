# ===================================================================
# Configuracoes Padrao da Aplicacao (Perfil: Producao / Dev)
# ===================================================================
spring.application.name=gerenciador-vendas-agua

# Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vendas_agua}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis Cache & Messaging
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Actuator & Observabilidade RED
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# Metricas RED (Rate, Errors, Duration) e Percentis para SLO
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99
management.metrics.tags.application=${spring.application.name}

# Tracing Distribuido (Micrometer Tracing + OpenTelemetry)
management.tracing.sampling.probability=1.0
management.tracing.enabled=true

# Springdoc OpenAPI 3.1
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Servidor
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# Feature Flags (Alternancia em tempo de execucao)
feature.fiscal-receipt-preview=${FEATURE_FISCAL_RECEIPT_PREVIEW:true}
feature.free-delivery-promo=${FEATURE_FREE_DELIVERY_PROMO:false}

